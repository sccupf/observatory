name: Deploy SCC UPF Observatory

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public observatory
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages
          retention-days: 1
      - name: Verify Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.expired == false and .name == "github-pages")] | length'); then
              if [[ "$count" == 1 ]]; then exit 0; fi
              if [[ "$count" -gt 1 ]]; then echo 'Multiple Pages artifacts; refusing ambiguous deployment' >&2; exit 1; fi
            fi
            sleep 10
          done
          echo 'Pages artifact was not registered within the bounded wait' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
