name: Smoke-test published SCC UPF pages and routing
on:
  workflow_run:
    workflows: [Deploy SCC UPF Observatory]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upf26-public-smoke
  cancel-in-progress: true

jobs:
  public-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve live public HTML and latest screened datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live/data/latest live/assets/branding/sccupfs
          base="https://sccupf.github.io/observatory"
          for path in index.html academic.html evidence.html business.html disclosure.html archive.html data/latest/daily.json data/latest/weekly.json data/latest/monthly.json assets/branding/sccupfs/logo-icon.svg assets/branding/sccupfs/favicon.svg; do
            curl -fSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 25 \
              "$base/$path" -o "live/$path"
          done
      - name: Validate publication, redaction and evidence semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("live")
          pages = ("index.html", "academic.html", "evidence.html", "business.html", "disclosure.html", "archive.html")
          for name in pages:
              doc = (root / name).read_text(encoding="utf-8")
              assert "<html" in doc.lower(), f"{name}: no HTML root"
              assert "SCC UPF" in doc, f"{name}: SCC UPF public branding missing"
              assert "UPF26" not in doc, f"Legacy branding in {name}"
              assert "<title>" in doc or "<title " in doc, f"{name}: no title element"
              assert "<footer" in doc, f"{name}: footer missing"
              assert 'id="scc-upf-brand"' in doc and 'class="scc-upf-signature"' in doc, f"{name}: brand system absent"
              assert 'assets/branding/sccupfs/favicon.svg' in doc, f"{name}: favicon absent"
              for legal_url in (
                  "https://sccnexus.co.uk/privacy.html",
                  "https://sccnexus.co.uk/accessibility.html",
                  "https://sccnexus.co.uk/terms.html",
                  "https://sccnexus.co.uk/contact.html",
              ):
                  assert f'href="{legal_url}"' in doc, f"{name}: missing {legal_url}"
              assert 'href="archive.html"' in doc, f"{name}: archive navigation missing"
              if name == "archive.html":
                  assert 'class="archive-nav"' in doc, "archive: primary nav missing"
                  assert 'href="#main"' in doc and 'id="main"' in doc, "archive: skip navigation broken"
              for marker in ("github_pat_", "-----BEGIN OPENSSH PRIVATE KEY"):
                  assert marker not in doc, name
          for asset in ("logo-icon.svg", "favicon.svg"):
              svg = (root / "assets" / "branding" / "sccupfs" / asset).read_text(encoding="utf-8")
              assert "<svg" in svg and "SCC Nexus emblem" in svg, f"Invalid brand asset: {asset}"
          expected = {"daily": "daily", "weekly": "weekly", "monthly": "monthly"}
          permitted = {
              "record_id", "published_date", "title", "doi", "journal", "url",
              "source_names", "query_ids", "index_source_count", "metadata_status",
              "is_retracted", "triage_tags", "is_new", "relevance_status",
              "relevance_rule", "relevance_gate_version"
          }
          for period in expected:
              data = json.loads((root / "data" / "latest" / (period + ".json")).read_text(encoding="utf-8"))
              assert data.get("project") in ("UPF26", "SCC UPF") and data.get("mode") == period  # legacy stored schema compatibility
              assert data.get("relevance_gate_version"), f"Unscreened {period} data"
              assert data.get("record_count") == len(data["records"])
              for record in data["records"]:
                  assert record.get("relevance_status") == "INCLUDED"
                  assert set(record).issubset(permitted), f"Unapproved bibliographic field in {period}"
          print("Live HTML, redacted data and snapshots validated.")
          PY
      - name: Test SCC Nexus custom subsite independently (advisory)
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sSL --connect-timeout 10 --max-time 30 -o /tmp/scc-upf.html -w '%{http_code}' 'https://sccnexus.co.uk/projects/scc-upf.html' || true)"
          echo "### SCC UPF public smoke results" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Pages: live pages and screened data checked by the preceding validation." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == "200" ]] && grep -iq 'SCC UPF' /tmp/scc-upf.html; then
            echo "- SCC Nexus /projects/scc-upf.html: HTTP 200 and SCC UPF content detected (not a DNS/certificate audit)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- SCC Nexus /projects/scc-upf.html: NOT VERIFIED (HTTP $status; routing or content may need website-owner action)." >> "$GITHUB_STEP_SUMMARY"
          fi
